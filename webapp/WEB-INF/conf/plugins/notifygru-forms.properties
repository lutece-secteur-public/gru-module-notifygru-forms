# Comma-separated list of entry type IDs.
# These entry types will not be managed by the provider (not present in the markers, etc.)
workflow-notifygrudirectory.refusedDirectoryEntryTypes=3,9,12,10,8,20

# uncomment / override value if senderName is required in SMS notification
#workflow-notifygrudirectory.gruprovider.sms.sendername=directory

# The question markers of this provider are safe HTML (escaped answers joined with <br>, rich text answers kept):
# notifygru renders them as sanitized HTML in the messages and as plain text in the SMS, subjects and status texts.
workflow-notifygru.markers.rich.provider.notifygru-forms.ProviderService=*
